stages:
  - deploy

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - 'ssh-keyscan -v -H "$VPS_HOST" >> ~/.ssh/known_hosts || echo "keyscan exit code: $?"'
  script:
    - ssh "$VPS_USER@$VPS_HOST" "cd /home/debian/fix-autoreload && git pull && docker compose up -d --build"
  only:
    - main
