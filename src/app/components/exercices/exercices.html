<div class="exercices">
    <h2>Exercices</h2>
    <div class="exercices--content">
        @for (view of views(); track view.exercice.id) {
            <article class="exercice category--{{ view.status }}">
                <header class="exercice__header">
                    <h3>{{ view.exercice.title }}</h3>
                    <span class="exercice__badge">{{ view.label }}</span>
                </header>
                <p class="exercice__due">Pour le {{ view.exercice.dueDate | date: 'd MMMM y' }}</p>
                <p class="exercice__id">id: {{ view.exercice.id }}</p>
            </article>
        } @empty {
            <h3>Plus rien à faire. Chorée time ?</h3>
        }
    </div>
</div>
